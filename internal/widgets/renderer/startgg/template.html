{{ define "set" }}
<div
    class="set"
    id="set-{{ .Id }}"
    data-set-id="{{ .Id }}"
    data-state="{{ .State }}"
    data-position="{{ .Position }}"
>
    {{ range .Players }}
    <div
        class="player {{ if eq .Nickname "" }}empty{{ end }}"
        data-slot="{{ .Slot }}"
    >
        <div class="player-slot">{{ .Slot }}</div>
        {{ if .Nickname }}
            {{ if .Prefix }}<div class="player-prefix">{{ .Prefix }}</div>{{ end }}
            <div class="player-name">{{ .Nickname }}</div>
            <div class="player-score">{{ .Score }}</div>
        {{ else }}
            <div class="player-name">—</div>
        {{ end }}
    </div>
    {{ end }}
</div>
{{ end }}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracket</title>
    <style> {{ .SystemCSS }}</style>
    <style> {{ .ThemeCSS }}</style>
    <style>
        /* Секции теперь позиционируются абсолютно внутри .bracket-content */
        .bracket-content { position: relative; }
        .bracket-section { position: absolute; }
    </style>
</head>
<body>
<div class="bracket-wrapper">
    <div class="bracket-viewport" id="bracket-viewport">
        <div class="bracket-content" id="bracket-content">
            <svg class="connections" id="connections-svg" xmlns="http://www.w3.org/2000/svg"></svg>
            <div class="bracket-section" id="winners-section">
                <div class="round-headers" id="winners-headers"></div>
                <div class="section-nodes" id="winners-nodes"></div>
            </div>
            <div class="bracket-section" id="final-section">
                <div class="round-headers" id="final-headers"></div>
                <div class="section-nodes" id="final-nodes"></div>
            </div>
            <div class="bracket-section" id="losers-section">
                <div class="round-headers" id="losers-headers"></div>
                <div class="section-nodes" id="losers-nodes"></div>
            </div>
        </div>
    </div>
</div>

<div class="bracket-error{{ if not .HasError }} hidden{{ end }}" id="bracket-error" role="alert">
    <div class="bracket-error__box">
        <div class="bracket-error__title">{{ .ErrorTitle }}</div>
        <div class="bracket-error__description">{{ .ErrorDescription }}</div>
        <button type="button" class="bracket-error__retry" id="bracket-error-retry">
            {{ .RetryLabel }}
        </button>
    </div>
</div>

<div class="zoom-controls" id="zoom-controls">
    <button type="button" class="zoom-btn" data-zoom="out" title="Zoom out">−</button>
    <button type="button" class="zoom-btn zoom-btn--level" id="zoom-level" data-zoom="reset" title="Reset zoom">100%</button>
    <button type="button" class="zoom-btn" data-zoom="in" title="Zoom in">+</button>
</div>

<div class="player-path hidden" id="player-path">
    <div class="player-path__inner" id="player-path-inner"></div>
</div>

<div class="player-search" id="player-search">
    <svg class="player-search__icon" width="14" height="14" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input id="player-search-input" type="text" autocomplete="off" spellcheck="false" />
    <button type="button" class="player-search__clear" id="player-search-clear">×</button>
</div>

<script>
    // ============================================================
    // CSS variables
    // ============================================================

    function getCSSVar(name, fallback) {
        const value = getComputedStyle(document.documentElement)
            .getPropertyValue(name)
            .trim();
        return value || fallback;
    }

    function getCSSPx(name, fallback) {
        const value = getCSSVar(name, '');
        if (!value) return fallback;
        const parsed = parseInt(value, 10);
        return isNaN(parsed) ? fallback : parsed;
    }

    let NODE_WIDTH, NODE_HEIGHT, LINK_WIDTH, NODE_GAP, COLUMN_STEP, TOTAL_COLUMNS;

    function readConfig() {
        NODE_WIDTH  = getCSSPx('--node-width', 220);
        NODE_HEIGHT = getCSSPx('--node-height', 76);
        LINK_WIDTH  = getCSSPx('--link-width', 60);
        NODE_GAP    = getCSSPx('--node-gap', 40);

        COLUMN_STEP = NODE_WIDTH + LINK_WIDTH;

        console.log('Bracket config:', {
            NODE_WIDTH, NODE_HEIGHT, LINK_WIDTH, NODE_GAP, COLUMN_STEP,
        });
    }

    // Максимум колонок среди всех секций — общая ширина сетки.
    function computeTotalColumns() {
        const roundsBySection = new Map();

        allSets.forEach(s => {
            if (!roundsBySection.has(s.section)) {
                roundsBySection.set(s.section, new Set());
            }
            roundsBySection.get(s.section).add(s.round);
        });

        let max = 1;
        roundsBySection.forEach(set => {
            if (set.size > max) max = set.size;
        });

        return max;
    }

    function computeSectionColumns(sectionName) {
        const rounds = new Set();
        allSets.forEach(s => {
            if (s.section === sectionName) rounds.add(s.round);
        });
        return rounds.size || 1;
    }

    // ============================================================
    // Данные из Go
    // ============================================================

    const allSets = [
        {{ range .Sets }}
        {
            id: "{{ .Id | js }}",
            section: "{{ .Section }}",
            round: {{ .Round }},
            state: {{ .State }},
            position: {{ .Position }},
            fullRoundText: "{{ .FullRoundText | js }}",
            stream: "{{ .Stream | js }}",
            winnerId: "{{ .WinnerId | js }}",
            players: [
                {{ range .Players }}
                { slot: {{ .Slot }}, id: "{{ .Id | js }}", prefix: "{{ .Prefix | js }}", nickname: "{{ .Nickname | js }}", score: {{ .Score }} },
                {{ end }}
            ],
            nextBrackets: [
                {{ range .NextBrackets }}
                { side: "{{ .Side }}", label: "{{ .Label | js }}", phaseName: "{{ .PhaseName | js }}", displayIdentifier: "{{ .DisplayIdentifier | js }}", phaseGroupId: {{ .PhaseGroupID }} },
                {{ end }}
            ]
        },
        {{ end }}
    ];

    const connections = [
        {{ range .Connections }}
        { fromSetID: "{{ .FromSetID | js }}", fromSlot: {{ .FromSlot }}, toSetID: "{{ .ToSetID | js }}", toSlot: {{ .ToSlot }}, condition: "{{ .Condition }}" },
        {{ end }}
    ];

    const BRACKET_ID = {{ .Id }};
    const BRACKET_LABEL = "{{ .Label | js }}";

    const PLAYER_SEARCH_LANG = (new URLSearchParams(window.location.search)
        .get('lang') || '').toUpperCase();
    const PLAYER_SEARCH_LABELS = PLAYER_SEARCH_LANG.startsWith('RU')
        ? {
            placeholder: 'Поиск игрока...',
            clearTitle: 'Очистить',
            path: 'Путь',
            winners: 'Виннеры',
            losers: 'Лузеры',
            final: 'Гранд-финал',
            notFound: 'Игрок не найден',
        }
        : {
            placeholder: 'Search player...',
            clearTitle: 'Clear',
            path: 'Path',
            winners: 'Winners',
            losers: 'Losers',
            final: 'Grand Final',
            notFound: 'Player not found',
        };

    let refreshPlayerSearch = null;

    // ============================================================
    // Bracket navigation
    // ============================================================

    function navigateToBracket(targetId, fromId, fromName) {
        if (!targetId) return;

        const parts = window.location.pathname.split('/').filter(Boolean);
        if (!parts.length) return;

        parts[parts.length - 1] = String(targetId);

        const params = new URLSearchParams(window.location.search);
        params.delete('_ts');
        params.delete('from');
        params.delete('fromName');

        if (fromId) {
            params.set('from', String(fromId));
            if (fromName) params.set('fromName', fromName);
        }

        const query = params.toString();
        window.location.assign(`/${parts.join('/')}${query ? `?${query}` : ''}`);
    }

    function setupPreviousBracketPlate() {
        const params = new URLSearchParams(window.location.search);
        const fromId = params.get('from');
        if (!fromId) return;

        const fromName = params.get('fromName') || `Phase group ${fromId}`;

        const plate = document.createElement('button');
        plate.type = 'button';
        plate.className = 'previous-bracket-plate';
        plate.title = fromName;

        const arrow = document.createElement('span');
        arrow.className = 'previous-bracket-plate__arrow';
        arrow.textContent = '←';

        const name = document.createElement('span');
        name.className = 'previous-bracket-plate__name';
        name.textContent = fromName;

        plate.append(arrow, name);
        plate.addEventListener('click', () => navigateToBracket(fromId, null, null));

        document.body.appendChild(plate);
    }

    // ============================================================
    // Stream platform detection
    // ============================================================

    function detectStreamPlatform(stream) {
        if (!stream) return '';
        const s = String(stream).toLowerCase().trim();
        if (s === 'twitch') return 'twitch';
        if (s === 'youtube') return 'youtube';
        if (s.includes('twitch.tv') || s.includes('twitch.com')) return 'twitch';
        if (s.includes('youtube.com') || s.includes('youtu.be')) return 'youtube';
        return '';
    }

    // ============================================================
    // Set element
    // ============================================================

    function getWinnerId(setData) {
        // В начальном HTML winnerId — строка, а после /data (JSON) — число.
        // Приводим оба id к строке, иначе строгое сравнение ломается и
        // подсветка победителя пропадает после первого автообновления.
        const rawWinnerId = setData.winnerId;
        return rawWinnerId !== undefined &&
            rawWinnerId !== null &&
            rawWinnerId !== '' &&
            rawWinnerId !== 0 &&
            rawWinnerId !== '0'
                ? String(rawWinnerId)
                : '';
    }

    function buildPlayersDiv(setData, targetPlayerId) {
        const playersDiv = document.createElement('div');
        playersDiv.className = 'set-players';

        const winnerId = getWinnerId(setData);
        const targetId =
            targetPlayerId !== undefined && targetPlayerId !== null
                ? String(targetPlayerId)
                : '';

        setData.players.forEach(player => {
            const isEmpty = !player.nickname || player.nickname === "";
            const playerId =
                player.id !== undefined && player.id !== null
                    ? String(player.id)
                    : '';
            const isWinner = !isEmpty && winnerId !== '' && playerId === winnerId;
            const isLoser = !isEmpty && winnerId !== '' && playerId !== winnerId;
            const isTarget = !isEmpty && targetId !== '' && playerId === targetId;

            const playerDiv = document.createElement('div');
            playerDiv.className = 'player'
                + (isEmpty  ? ' empty'  : '')
                + (isWinner ? ' winner' : '')
                + (isLoser  ? ' loser'  : '')
                + (isTarget ? ' highlighted' : '');
            playerDiv.dataset.slot = player.slot;

            playerDiv.innerHTML = `
                ${player.nickname ? `
                    ${player.prefix ? `<div class="player-prefix">${player.prefix}</div>` : ""}
                    <div class="player-name">${player.nickname}</div>
                    <div class="player-score">${player.score}</div>
                ` : `<div class="player-name">—</div>`}
            `;

            playersDiv.appendChild(playerDiv);
        });

        return playersDiv;
    }

    function createSetElement(setData) {
        const wrapper = document.createElement('div');
        wrapper.className = 'set-wrapper';

        const div = document.createElement('div');
        div.className = 'set';
        div.id = `set-${setData.id}`;
        div.dataset.setId = setData.id;
        div.dataset.state = setData.state;

        div.appendChild(buildPlayersDiv(setData, null));

        if (setData.stream) {
            const liveDiv = document.createElement('div');
            liveDiv.className = 'set-live';
            liveDiv.title = setData.stream;
            liveDiv.textContent = 'LIVE';

            const platform = detectStreamPlatform(setData.stream);
            if (platform) {
                liveDiv.classList.add(`set-live--${platform}`);
            }

            div.appendChild(liveDiv);
        }

        wrapper.appendChild(div);
        return wrapper;
    }

    // ============================================================
    // Next bracket plate
    // ============================================================

    function createNextBracketPlate(nextBrackets, currentPhaseGroupId) {
        const plate = document.createElement('div');
        plate.className = 'next-bracket-plate';

        nextBrackets.forEach(target => {
            const isExternal = target.phaseGroupId &&
                Number(target.phaseGroupId) !== Number(currentPhaseGroupId);

            const row = document.createElement(isExternal ? 'button' : 'div');
            row.className = 'next-bracket-plate__row';

            if (isExternal) {
                row.type = 'button';
                row.classList.add('next-bracket-plate__row--link');
                row.addEventListener('click', () => {
                    navigateToBracket(
                        target.phaseGroupId,
                        BRACKET_ID,
                        BRACKET_LABEL,
                    );
                });
            }

            if (nextBrackets.length > 1) {
                const side = document.createElement('span');
                side.className = 'next-bracket-plate__side';
                side.textContent = target.side === 'loser' ? 'L' : 'W';
                row.appendChild(side);
            }

            const arrow = document.createElement('span');
            arrow.className = 'next-bracket-plate__arrow';
            arrow.textContent = '→';

            const name = document.createElement('span');
            name.className = 'next-bracket-plate__name';
            name.textContent =
                target.label ||
                target.phaseName ||
                target.displayIdentifier ||
                '';
            name.title = name.textContent;

            row.append(arrow, name);
            plate.appendChild(row);
        });

        return plate;
    }

    // Рендерит плашки "куда ведёт следующий бой" под финальными нодами
    // секции. Возвращает максимальную нижнюю границу в пикселях, чтобы
    // можно было расширить высоту секции.
    function appendNextBracketPlates(roots, container) {
        let maxBottom = 0;

        roots.forEach(root => {
            const allTargets = root.nextBrackets || [];
            const winnerTargets = allTargets.filter(t => t.side === 'winner');
            // Показываем путь победителя; если его нет — путь проигравшего.
            const targets = winnerTargets.length ? winnerTargets : allTargets;
            if (!targets.length) return;

            const plate = createNextBracketPlate(targets, BRACKET_ID);
            const left = (root.x || 0) * COLUMN_STEP;
            const top = ((root.y || 0) + 1) * (NODE_HEIGHT + NODE_GAP);

            plate.style.left = `${left}px`;
            plate.style.top = `${top}px`;
            container.appendChild(plate);

            const bottom = top + plate.offsetHeight;
            if (bottom > maxBottom) maxBottom = bottom;
        });

        return maxBottom;
    }

    // ============================================================
    // Player search / path
    // ============================================================

    function clearPlayerSearchView() {
        document.documentElement.classList.remove('player-search-active');

        const path = document.getElementById('player-path');
        if (path) path.classList.add('hidden');

        const inner = document.getElementById('player-path-inner');
        if (inner) inner.innerHTML = '';
    }

    function findPlayerPath(query) {
        const q = String(query || '').trim().toLowerCase();
        if (!q) return null;

        const exact = new Map();
        const partial = new Map();

        const add = (map, player, setData) => {
            const id = player.id !== undefined && player.id !== null
                ? String(player.id)
                : '';
            if (!id) return;

            let entry = map.get(id);
            if (!entry) {
                entry = { id, nickname: player.nickname, sets: [] };
                map.set(id, entry);
            }
            if (!entry.sets.includes(setData)) {
                entry.sets.push(setData);
            }
        };

        allSets.forEach(setData => {
            const players = setData.players || [];

            // Бай/пустой слот — не считаем полноценным боем.
            const filled = players.filter(p => p.nickname && p.nickname.trim());
            if (filled.length < 2) return;

            players.forEach(player => {
                const name = String(player.nickname || '').trim().toLowerCase();
                if (!name) return;

                if (name === q) {
                    add(exact, player, setData);
                } else if (name.includes(q)) {
                    add(partial, player, setData);
                }
            });
        });

        const pool = exact.size ? exact : partial;
        if (!pool.size) return null;

        let best = null;
        pool.forEach(entry => {
            if (!best || entry.sets.length > best.sets.length) {
                best = entry;
            }
        });

        return best;
    }

    function sortPathSets(section, sets) {
        const result = sets.slice();

        if (section === 'losers') {
            // Раунды лузеров отрицательные: -1, -2, ... — от ранних к поздним.
            result.sort((a, b) =>
                (b.round - a.round) || ((a.position || 0) - (b.position || 0)),
            );
        } else {
            result.sort((a, b) =>
                (a.round - b.round) || ((a.position || 0) - (b.position || 0)),
            );
        }

        return result;
    }

    function createPathCard(setData, targetPlayerId) {
        const card = document.createElement('div');
        card.className = 'path-card';

        const head = document.createElement('div');
        head.className = 'path-card__head';

        const round = document.createElement('div');
        round.className = 'path-card__round';
        round.textContent = setData.fullRoundText || '';
        round.title = round.textContent;
        head.appendChild(round);

        const winnerId = getWinnerId(setData);
        if (winnerId) {
            const won = String(winnerId) === String(targetPlayerId);
            const result = document.createElement('span');
            result.className = 'path-card__result ' +
                (won ? 'path-card__result--win' : 'path-card__result--loss');
            result.textContent = won ? 'W' : 'L';
            head.appendChild(result);
        }

        const set = document.createElement('div');
        set.className = 'set';
        set.dataset.state = setData.state;
        set.appendChild(buildPlayersDiv(setData, targetPlayerId));

        card.append(head, set);
        return card;
    }

    function renderPlayerPath(playerData) {
        const inner = document.getElementById('player-path-inner');
        if (!inner) return;

        inner.innerHTML = '';

        const header = document.createElement('div');
        header.className = 'player-path__header';
        header.textContent = PLAYER_SEARCH_LABELS.path + ': ' + playerData.nickname;
        inner.appendChild(header);

        const groups = [
            { key: 'winners', title: PLAYER_SEARCH_LABELS.winners },
            { key: 'losers', title: PLAYER_SEARCH_LABELS.losers },
            { key: 'final', title: PLAYER_SEARCH_LABELS.final },
        ];

        let rendered = 0;

        groups.forEach(group => {
            const sets = sortPathSets(
                group.key,
                playerData.sets.filter(setData => setData.section === group.key),
            );
            if (!sets.length) return;

            rendered += sets.length;

            const row = document.createElement('div');
            row.className = 'player-path__row';

            const title = document.createElement('div');
            title.className = 'player-path__row-title';
            title.textContent = group.title;
            row.appendChild(title);

            const track = document.createElement('div');
            track.className = 'player-path__track';

            sets.forEach((setData, index) => {
                if (index > 0) {
                    const arrow = document.createElement('div');
                    arrow.className = 'path-arrow';
                    arrow.textContent = '→';
                    track.appendChild(arrow);
                }
                track.appendChild(createPathCard(setData, playerData.id));
            });

            row.appendChild(track);
            inner.appendChild(row);
        });

        if (!rendered) {
            const empty = document.createElement('div');
            empty.className = 'player-path__header';
            empty.textContent = PLAYER_SEARCH_LABELS.notFound;
            inner.appendChild(empty);
        }
    }

    function setupPlayerSearch() {
        const search = document.getElementById('player-search');
        const input = document.getElementById('player-search-input');
        const clear = document.getElementById('player-search-clear');

        if (!search || !input || !clear) return;

        input.placeholder = PLAYER_SEARCH_LABELS.placeholder;
        clear.title = PLAYER_SEARCH_LABELS.clearTitle;
        clear.setAttribute('aria-label', PLAYER_SEARCH_LABELS.clearTitle);

        const update = () => {
            const value = input.value.trim();
            search.classList.toggle('has-value', !!value);

            if (!value) {
                search.classList.remove('player-search--not-found');
                clearPlayerSearchView();
                return;
            }

            const player = findPlayerPath(value);
            if (!player) {
                search.classList.add('player-search--not-found');
                clearPlayerSearchView();
                return;
            }

            search.classList.remove('player-search--not-found');
            renderPlayerPath(player);

            const path = document.getElementById('player-path');
            if (path) path.classList.remove('hidden');
            document.documentElement.classList.add('player-search-active');
        };

        refreshPlayerSearch = update;

        input.addEventListener('input', update);

        input.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                input.value = '';
                update();
                input.blur();
            }
        });

        clear.addEventListener('click', () => {
            input.value = '';
            update();
            input.focus();
        });
    }

    // ============================================================
    // Tree
    // ============================================================

    function buildTree(sectionName) {
        const setsMap = new Map();

        allSets.filter(s => s.section === sectionName).forEach(setData => {
            setsMap.set(setData.id, { ...setData, children: [], parents: [] });
        });

        let matched = 0, notFoundFrom = 0, notFoundTo = 0;

        connections.forEach(conn => {
            const from = setsMap.get(conn.fromSetID);
            const to = setsMap.get(conn.toSetID);

            if (!from && !to) return;
            if (!from) { notFoundFrom++; return; }
            if (!to)   { notFoundTo++;   return; }

            matched++;

            const toSlot = conn.toSlot !== undefined ? conn.toSlot : 0;
            const fromSlot = conn.fromSlot !== undefined ? conn.fromSlot : 0;

            to.children.push({ node: from, slot: fromSlot, toSlot: toSlot });
            from.parents.push({ node: to, slot: toSlot, fromSlot: fromSlot });
        });

        const allSetsArray = Array.from(setsMap.values());
        let rootRound;
        if (sectionName === 'losers') {
            rootRound = Math.min(...allSetsArray.map(s => s.round));
        } else {
            rootRound = Math.max(...allSetsArray.map(s => s.round));
        }
        const roots = allSetsArray.filter(s => s.round === rootRound);

        if (roots.length === 0 && allSetsArray.length > 0) {
            const maxRound = Math.max(...allSetsArray.map(s => s.round));
            roots.push(...allSetsArray.filter(s => s.round === maxRound));
        }

        return { setsMap, roots };
    }

    function assignYCoordinate(node, orderCounter, visited = new Set()) {
        if (!node || visited.has(node.id)) return;
        visited.add(node.id);

        const sortedChildren = node.children.slice().sort((a, b) => {
            const slotA = a.slot !== undefined ? a.slot : 0;
            const slotB = b.slot !== undefined ? b.slot : 0;
            return slotA - slotB;
        });

        if (sortedChildren.length === 1) {
            assignYCoordinate(sortedChildren[0].node, orderCounter, visited);
            node.y = sortedChildren[0].node.y;
            return;
        }

        if (sortedChildren[0]) {
            assignYCoordinate(sortedChildren[0].node, orderCounter, visited);
        }

        node.y = orderCounter.value++;

        if (sortedChildren[1]) {
            assignYCoordinate(sortedChildren[1].node, orderCounter, visited);
        }
    }

    function assignDepthAndX(roots) {
        let maxDepth = 0;

        function calculateDepth(node, depth, visited) {
            if (!node || visited.has(node.id)) return;
            visited.add(node.id);
            node.depth = depth;
            if (depth > maxDepth) maxDepth = depth;
            node.children.forEach(ch => calculateDepth(ch.node, depth + 1, visited));
        }

        roots.forEach(root => calculateDepth(root, 0, new Set()));
        roots.forEach(root => {
            function invertX(node, visited) {
                if (!node || visited.has(node.id)) return;
                visited.add(node.id);
                node.x = maxDepth - node.depth;
                node.children.forEach(ch => invertX(ch.node, visited));
            }
            invertX(root, new Set());
        });

        return maxDepth;
    }

    function centerParents(roots) {
        function postOrder(node, visited) {
            if (!node || visited.has(node.id)) return;
            visited.add(node.id);
            node.children.forEach(ch => postOrder(ch.node, visited));

            if (node.children.length === 2) {
                node.y = (node.children[0].node.y + node.children[1].node.y) / 2;
            } else if (node.children.length === 1) {
                node.y = node.children[0].node.y;
            } else if (node.y === undefined) {
                node.y = 0;
            }
        }
        roots.forEach(root => postOrder(root, new Set()));
    }

    function compressVertically(roots) {
        roots.forEach(root => {
            function divide(node, visited) {
                if (!node || visited.has(node.id)) return;
                visited.add(node.id);
                node.children.forEach(ch => divide(ch.node, visited));

                if (typeof node.y === 'number' && !isNaN(node.y)) {
                    node.y = node.y / 2;
                }

                if (node.children.length === 1) {
                    node.y = node.children[0].node.y;
                } else if (node.children.length === 2) {
                    node.y = (node.children[0].node.y + node.children[1].node.y) / 2;
                }
            }
            divide(root, new Set());
        });
    }

    // xOffset — на сколько колонок сдвинуть заголовки внутри секции.
    function renderRoundHeaders(headersContainerId, setsMap, xOffset = 0) {
        const container = document.getElementById(headersContainerId);
        if (!container) return;
        container.innerHTML = '';

        const roundsByX = new Map();
        setsMap.forEach(setData => {
            if (typeof setData.x !== 'number') return;
            const key = setData.x;
            if (!roundsByX.has(key)) {
                roundsByX.set(key, {
                    x: key,
                    fullRoundText: setData.fullRoundText || `Round ${setData.round}`,
                    count: 0,
                });
            }
            roundsByX.get(key).count++;
        });

        Array.from(roundsByX.values())
            .sort((a, b) => a.x - b.x)
            .forEach(round => {
                const header = document.createElement('div');
                header.className = 'round-header';
                header.textContent = round.fullRoundText;
                header.title = round.fullRoundText;
                header.style.left = `${(round.x + xOffset) * COLUMN_STEP}px`;
                container.appendChild(header);
            });
    }

    // ============================================================
    // Render sections
    // ============================================================

    // Рендерит секцию в контейнер. Позиционирует саму секцию
    // (position:absolute) по X/Y в координатах .bracket-content.
    function renderSection(sectionName, containerId, headersContainerId, xOffset = 0, yOffset = 0) {
        const container = document.getElementById(containerId);
        if (!container) return null;

        const section = container.closest('.bracket-section');

        const { setsMap, roots } = buildTree(sectionName);
        if (setsMap.size === 0) {
            if (section) section.classList.add('hidden');
            return { setsMap, roots, maxDepth: 0, xOffset, yOffset, width: 0, height: 0 };
        }

        if (roots.length === 0) {
            if (section) {
                section.classList.add('hidden');
                section.style.display = 'none';
            }
            return null;
        }

        const SUBTREE_GAP_UNITS = 2;
        const orderCounter = { value: 0 };
        const visitedY = new Set();

        roots.forEach((root, index) => {
            if (index > 0) orderCounter.value += SUBTREE_GAP_UNITS;
            assignYCoordinate(root, orderCounter, visitedY);
        });

        const maxDepth = assignDepthAndX(roots);
        centerParents(roots);
        compressVertically(roots);

        setsMap.forEach(setData => {
            const element = createSetElement(setData);
            const left = (setData.x || 0) * COLUMN_STEP;   // внутри секции — от 0
            const top  = (setData.y || 0) * (NODE_HEIGHT + NODE_GAP);
            element.style.left = `${left}px`;
            element.style.top  = `${top}px`;
            container.appendChild(element);
        });

        let maxY = 0;
        setsMap.forEach(setData => {
            if (typeof setData.y === 'number' && !isNaN(setData.y) && setData.y > maxY) {
                maxY = setData.y;
            }
        });

        const plateBottom = appendNextBracketPlates(roots, container);

        const width  = (maxDepth + 1) * COLUMN_STEP - LINK_WIDTH;
        const baseHeight = (maxY + 1) * (NODE_HEIGHT + NODE_GAP) - NODE_GAP;
        const height = Math.max(baseHeight, plateBottom);

        container.style.width  = `${width}px`;
        container.style.height = `${height}px`;

        // позиционируем саму секцию в координатах .bracket-content
        if (section) {
            section.style.left = `${xOffset * COLUMN_STEP}px`;
            section.style.top  = `${yOffset}px`;
        }

        renderRoundHeaders(headersContainerId, setsMap, 0);  // внутри секции offset 0
        return { setsMap, roots, maxDepth, xOffset, yOffset, width, height };
    }

    // final-секция рендерится отдельно: сдвиг по X = winnersColumns,
    // по Y — подгоняем так, чтобы roots[0].y совпал с winnersRootY.
    function renderFinalSection(winnersRootY, xOffset, yOffset) {
        const container = document.getElementById('final-nodes');
        if (!container) return null;

        const section = container.closest('.bracket-section');

        const { setsMap, roots } = buildTree('final');
        if (roots.length === 0) {
            if (section) {
                section.classList.add('hidden');
                section.style.display = 'none';
            }
            return null;
        }

        const orderCounter = { value: 0 };
        const visitedY = new Set();
        roots.forEach(root => assignYCoordinate(root, orderCounter, visitedY));

        const maxDepth = assignDepthAndX(roots);
        centerParents(roots);
        compressVertically(roots);

        let rootY = 0;
        if (roots.length > 0 && typeof roots[0].y === 'number') rootY = roots[0].y;

        const offsetY = winnersRootY - rootY;

        setsMap.forEach(setData => {
            const finalY = (setData.y || 0) + offsetY;
            const element = createSetElement(setData);
            const left = (setData.x || 0) * COLUMN_STEP;
            element.style.left = `${left}px`;
            element.style.top  = `${finalY * (NODE_HEIGHT + NODE_GAP)}px`;
            container.appendChild(element);
            setData.y = finalY;
        });

        let maxY = 0;
        setsMap.forEach(setData => {
            if (typeof setData.y === 'number' && !isNaN(setData.y) && setData.y > maxY) {
                maxY = setData.y;
            }
        });

        const plateBottom = appendNextBracketPlates(roots, container);

        const width  = (maxDepth + 1) * COLUMN_STEP - LINK_WIDTH;
        const baseHeight = (maxY + 1) * (NODE_HEIGHT + NODE_GAP) - NODE_GAP;
        const height = Math.max(baseHeight, plateBottom);

        container.style.width  = `${width}px`;
        container.style.height = `${height}px`;

        if (section) {
            section.style.left = `${xOffset * COLUMN_STEP}px`;
            section.style.top  = `${yOffset}px`;
        }

        renderRoundHeaders('final-headers', setsMap, 0);
        return { setsMap, roots, maxDepth, xOffset, yOffset, width, height };
    }

    function renderConnections() {
        const svg = document.getElementById('connections-svg');
        const content = document.getElementById('bracket-content');

        if (!svg || !content) return;

        svg.innerHTML = '';

        // SVG живёт внутри .bracket-content, поэтому работает в тех же
        // (не масштабированных) координатах, что и ноды. При зуме всё
        // масштабируется вместе через transform на .bracket-viewport.
        const scale = currentScale > 0 ? currentScale : 1;
        const contentRect = content.getBoundingClientRect();
        const width  = content.offsetWidth;
        const height = content.offsetHeight;

        svg.setAttribute('width', width);
        svg.setAttribute('height', height);
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        svg.style.width  = `${width}px`;
        svg.style.height = `${height}px`;

        connections.forEach(conn => {
            const fromEl = document.getElementById(`set-${conn.fromSetID}`);
            const toEl   = document.getElementById(`set-${conn.toSetID}`);
            if (!fromEl || !toEl) return;

            const fromSection = fromEl.closest('.bracket-section');
            const toSection   = toEl.closest('.bracket-section');

            const fromSectionId = fromSection?.id;
            const toSectionId   = toSection?.id;

            const involvesLosers =
                fromSectionId === 'losers-section' || toSectionId === 'losers-section';

            if (involvesLosers && fromSectionId !== toSectionId) return;

            const fromRect = fromEl.getBoundingClientRect();
            const toRect   = toEl.getBoundingClientRect();

            // Скрытая секция (display: none) даёт нулевые rect'ы —
            // не рисуем для неё вырожденные линии.
            if ((fromRect.width === 0 && fromRect.height === 0) ||
                (toRect.width === 0 && toRect.height === 0)) {
                return;
            }

            // Переводим экранные (уже масштабированные) координаты
            // в локальные координаты контента.
            const x1 = (fromRect.right - contentRect.left) / scale;
            const y1 = (fromRect.top + fromRect.height / 2 - contentRect.top) / scale;
            const x2 = (toRect.left - contentRect.left) / scale;
            const y2 = (toRect.top + toRect.height / 2 - contentRect.top) / scale;

            const midX = (x1 + x2) / 2;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.classList.add('connection');
            path.dataset.fromSet  = conn.fromSetID;
            path.dataset.toSet    = conn.toSetID;
            path.dataset.fromSlot = conn.fromSlot;
            path.dataset.toSlot   = conn.toSlot;

            path.setAttribute('d', `M ${x1} ${y1} H ${midX} V ${y2} H ${x2}`);
            svg.appendChild(path);
        });
    }

    // ============================================================
    // Init
    // ============================================================

    function getBracketMode() {
        const root = document.documentElement;
        if (root.classList.contains('bracket-mode-winners')) return 'winners';
        if (root.classList.contains('bracket-mode-losers'))  return 'losers';
        return 'all';
    }

    // Центрируем сетку в области просмотра. Если сетка меньше экрана —
    // выравниваем по центру, если больше — центрируем прокрутку.
    function layoutViewport(recenterScroll = false) {
        const wrapper  = document.querySelector('.bracket-wrapper');
        const viewport = document.getElementById('bracket-viewport');
        const content  = document.getElementById('bracket-content');

        if (!wrapper || !viewport || !content) return;

        const scale    = currentScale > 0 ? currentScale : 1;
        const contentW = content.offsetWidth * scale;
        const contentH = content.offsetHeight * scale;
        const viewW    = wrapper.clientWidth;
        const viewH    = wrapper.clientHeight;

        const left = contentW < viewW ? (viewW - contentW) / 2 : 0;
        const top  = contentH < viewH ? (viewH - contentH) / 2 : 0;

        viewport.style.left = `${left}px`;
        viewport.style.top  = `${top}px`;

        if (!recenterScroll) return;

        const maxScrollLeft = wrapper.scrollWidth  - wrapper.clientWidth;
        const maxScrollTop  = wrapper.scrollHeight - wrapper.clientHeight;

        if (maxScrollLeft > 0) wrapper.scrollLeft = maxScrollLeft / 2;
        if (maxScrollTop  > 0) wrapper.scrollTop  = maxScrollTop  / 2;
    }

    function clearLayout() {
        ['winners-nodes', 'final-nodes', 'losers-nodes',
         'winners-headers', 'final-headers', 'losers-headers'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = '';
        });

        const svg = document.getElementById('connections-svg');
        if (svg) svg.innerHTML = '';
    }

    function init() {
        // init() вызывается повторно (загрузка, auto-refresh, смена режима),
        // поэтому чистим контейнеры, чтобы не дублировать ноды.
        clearLayout();

        readConfig();
        TOTAL_COLUMNS = computeTotalColumns();

        const mode = getBracketMode();

        const winnersColumns = computeSectionColumns('winners');
        const finalColumns   = computeSectionColumns('final');
        const losersColumns  = computeSectionColumns('losers');

        // X-сдвиги (в колонках):
        //   winners — 0
        //   final   — сразу после winners
        //   losers  — выравниваем по ПРАВОМУ краю с final,
        //             а в режиме "losers" начинаем с 0
        const winnersXOffset = 0;
        const finalXOffset   = winnersColumns;
        const losersXOffset  = mode === 'losers'
            ? 0
            : Math.max(0, (finalXOffset + finalColumns) - losersColumns);

        // Сначала рендерим winners, чтобы узнать высоту и root Y.
        const winnersResult = renderSection(
            'winners', 'winners-nodes', 'winners-headers',
            winnersXOffset, 0
        );

        const winnersHeight = winnersResult?.height ?? 0;
        const winnersRootY  = winnersResult?.roots?.[0]?.y ?? 0;

        // Final: X — сразу после winners, Y — выравниваем по winnersRootY.
        // Но секция final абсолютная, внутри неё offsetY уже применён
        // к нодам, так что top секции = 0 (выравнивание ушло в ноды).
        const finalYOffset = 0;
        const finalResult = renderFinalSection(winnersRootY, finalXOffset, finalYOffset);

        // Losers: в режиме "losers" показываем их в начале (сверху),
        // в остальных режимах — под winners + отступ между рядами.
        const ROWS_GAP = NODE_GAP * 4;
        const losersYOffset = mode === 'losers' ? 0 : winnersHeight + ROWS_GAP;

        const losersResult = renderSection(
            'losers', 'losers-nodes', 'losers-headers',
            losersXOffset, losersYOffset
        );

        // Общая ширина/высота .bracket-content — по видимым секциям.
        const content = document.getElementById('bracket-content');
        if (content) {
            const winnersVisible = mode !== 'losers';
            const losersVisible  = mode !== 'winners';

            const visible = [];
            if (winnersVisible) {
                if (winnersResult) visible.push(winnersResult);
                if (finalResult)   visible.push(finalResult);
            }
            if (losersVisible && losersResult) {
                visible.push(losersResult);
            }

            let totalWidth  = 0;
            let totalHeight = 0;

            visible.forEach(res => {
                totalWidth  = Math.max(totalWidth,  res.xOffset * COLUMN_STEP + res.width);
                totalHeight = Math.max(totalHeight, res.yOffset + res.height);
            });

            content.style.width  = `${Math.max(totalWidth, 1)}px`;
            content.style.height = `${Math.max(totalHeight, 1)}px`;
        }

        layoutViewport(true);

        // Рисуем сразу по готовому layout, затем перерисовываем после
        // кадров и с небольшой задержкой: смена режима/секций может менять
        // скроллбары, размеры контента и положение viewport уже после
        // первого расчёта — из-за этого линии оставались на старых местах.
        renderConnections();
        requestAnimationFrame(() => {
            renderConnections();
            requestAnimationFrame(renderConnections);
        });
        setTimeout(renderConnections, 120);

        if (refreshPlayerSearch) refreshPlayerSearch();
    }

    // Полная пересборка разметки (нужна при смене режима отображения,
    // потому что меняются смещения и размеры секций).
    function rebuildLayout() {
        ['winners-section', 'final-section', 'losers-section'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('hidden');
                el.style.display = '';
            }
        });

        init();
    }

    // ============================================================
    // Player highlight
    // ============================================================

    function setupPlayerHighlight() {
        const content = document.getElementById('bracket-content');
        if (!content) return;

        let currentNickname = null;

        function clearHighlight() {
            document.querySelectorAll('.player.highlighted').forEach(el => el.classList.remove('highlighted'));
            document.querySelectorAll('.connection.highlighted').forEach(el => el.classList.remove('highlighted'));
            currentNickname = null;
        }

        function applyHighlight(nickname) {
            if (!nickname) return;
            currentNickname = nickname;

            const highlightedSlots = new Set();

            document.querySelectorAll('.set').forEach(setEl => {
                const setId = setEl.dataset.setId;
                if (!setId) return;

                setEl.querySelectorAll('.player').forEach(playerEl => {
                    const nameEl = playerEl.querySelector('.player-name');
                    if (!nameEl) return;

                    if (nameEl.textContent.trim() === nickname) {
                        playerEl.classList.add('highlighted');
                        const slot = playerEl.dataset.slot;
                        if (slot !== undefined) highlightedSlots.add(`${setId}:${slot}`);
                    }
                });
            });

            document.querySelectorAll('.connection.highlighted').forEach(el => el.classList.remove('highlighted'));

            const toHighlight = [];
            document.querySelectorAll('.connection').forEach(pathEl => {
                const fromSetId = pathEl.dataset.fromSet;
                const toSetId   = pathEl.dataset.toSet;
                const fromSlot  = pathEl.dataset.fromSlot;
                const toSlot    = pathEl.dataset.toSlot;
                if (!fromSetId || !toSetId) return;

                const fromMatch = highlightedSlots.has(`${fromSetId}:${fromSlot}`);
                const toMatch   = highlightedSlots.has(`${toSetId}:${toSlot}`);

                const toHasPlayer = document.querySelector(
                    `#set-${toSetId} .player[data-slot="${toSlot}"] .player-name`
                )?.textContent.trim();
                const toIsEmpty = !toHasPlayer || toHasPlayer === '—';

                if ((fromMatch || toMatch) && !toIsEmpty) {
                    toHighlight.push(pathEl);
                }
            });

            const svg = document.getElementById('connections-svg');
            toHighlight.forEach(pathEl => {
                pathEl.classList.add('highlighted');
                svg.appendChild(pathEl);
            });
        }

        content.addEventListener('mouseover', (e) => {
            const playerEl = e.target.closest('.player');
            if (!playerEl) return;

            const nameEl = playerEl.querySelector('.player-name');
            if (!nameEl) return;

            const nickname = nameEl.textContent.trim();
            if (!nickname || nickname === '—') return;
            if (nickname === currentNickname) return;

            clearHighlight();
            applyHighlight(nickname);
        });

        content.addEventListener('mouseleave', clearHighlight);
    }

    // ============================================================
    // Zoom
    // ============================================================

    const ZOOM_MIN = 0.5;
    const ZOOM_MAX = 2.0;
    const ZOOM_STEP = 0.1;

    let currentScale = 1.0;

    function clampScale(scale) {
        let s = parseFloat(scale);
        if (isNaN(s) || s <= 0) s = 1.0;
        return Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, s));
    }

    function updateZoomLabel() {
        const label = document.getElementById('zoom-level');
        if (label) label.textContent = `${Math.round(currentScale * 100)}%`;
    }

    function applyScale(scale) {
        const viewport = document.getElementById('bracket-viewport');

        currentScale = clampScale(scale);

        if (viewport) {
            viewport.style.transform = `scale(${currentScale})`;
            viewport.style.transformOrigin = 'top left';
        }

        updateZoomLabel();
    }

    function setZoom(scale) {
        applyScale(scale);
        notifyZoom(currentScale);
        // SVG связей живёт внутри масштабируемого контента,
        // поэтому перерисовка не обязательна, но гарантирует
        // точное выравнивание после любых изменений layout.
        layoutViewport(true);
        requestAnimationFrame(renderConnections);
    }

    function notifyZoom(scale) {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage(
                { type: 'bracket:zoom-changed', scale },
                '*',
            );
        }
    }

    function bindZoomControls() {
        const controls = document.getElementById('zoom-controls');
        if (!controls) return;

        controls.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-zoom]');
            if (!btn) return;

            switch (btn.dataset.zoom) {
                case 'in':    setZoom(currentScale + ZOOM_STEP); break;
                case 'out':   setZoom(currentScale - ZOOM_STEP); break;
                case 'reset': setZoom(1.0); break;
            }
        });

        // Ctrl + колесо мыши — зум, обычное колесо — прокрутка сетки.
        window.addEventListener('wheel', (e) => {
            if (!e.ctrlKey) return;
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
            setZoom(currentScale * factor);
        }, { passive: false });

        updateZoomLabel();
    }

    // ============================================================
    // Drag to pan
    // ============================================================

    function setupDragPan() {
        const wrapper = document.querySelector('.bracket-wrapper');
        if (!wrapper) return;

        let dragging = false;
        let startX = 0;
        let startY = 0;
        let startScrollLeft = 0;
        let startScrollTop = 0;

        const isInteractive = (target) => {
            if (!target || !(target instanceof Element)) return false;
            return !!target.closest(
                'button, a, input, select, textarea, [data-no-drag], .bracket-error, .player-search, .player-path',
            );
        };

        const stop = () => {
            if (!dragging) return;
            dragging = false;
            document.documentElement.classList.remove('bracket-dragging');
        };

        document.addEventListener('mousedown', (event) => {
            if (event.button !== 0) return;
            if (document.documentElement.classList.contains('player-search-active')) return;
            if (isInteractive(event.target)) return;

            const rect = wrapper.getBoundingClientRect();

            // Не перехватываем клики по скроллбарам — они должны работать.
            const onVerticalScrollbar = event.clientX >= rect.left + wrapper.clientWidth;
            const onHorizontalScrollbar = event.clientY >= rect.top + wrapper.clientHeight;
            if (onVerticalScrollbar || onHorizontalScrollbar) return;

            dragging = true;
            startX = event.clientX;
            startY = event.clientY;
            startScrollLeft = wrapper.scrollLeft;
            startScrollTop = wrapper.scrollTop;

            document.documentElement.classList.add('bracket-dragging');

            // Сбрасываем подсветку игрока, иначе она «залипнет» на время drag.
            const content = document.getElementById('bracket-content');
            if (content) content.dispatchEvent(new MouseEvent('mouseleave'));

            event.preventDefault();
        });

        document.addEventListener('mousemove', (event) => {
            if (!dragging) return;
            if (event.buttons === 0) {
                stop();
                return;
            }

            const dx = event.clientX - startX;
            const dy = event.clientY - startY;

            wrapper.scrollLeft = startScrollLeft - dx;
            wrapper.scrollTop = startScrollTop - dy;
        });

        document.addEventListener('mouseup', stop);
        document.addEventListener('mouseleave', stop);
        window.addEventListener('blur', stop);
    }

    // ============================================================
    // Auto-refresh
    // ============================================================

    const AUTO_REFRESH_INTERVAL_MS = 60_000;
    let autoRefreshTimerId = null;

    function startAutoRefresh() {
        if (autoRefreshTimerId != null) return;
        console.log('[bracket] auto-refresh enabled, interval:', AUTO_REFRESH_INTERVAL_MS);

        autoRefreshTimerId = setInterval(() => {
            console.log('[bracket] auto-refresh tick');
            refreshBracketData();
        }, AUTO_REFRESH_INTERVAL_MS);
    }

    function stopAutoRefresh() {
        if (autoRefreshTimerId == null) return;
        clearInterval(autoRefreshTimerId);
        autoRefreshTimerId = null;
        console.log('[bracket] auto-refresh disabled');
    }

    // ============================================================
    // Error overlay
    // ============================================================

    function showBracketError() {
        const el = document.getElementById('bracket-error');
        if (el) el.classList.remove('hidden');
    }

    function hideBracketError() {
        const el = document.getElementById('bracket-error');
        if (el) el.classList.add('hidden');
    }

    function setupBracketError() {
        const retry = document.getElementById('bracket-error-retry');
        if (!retry) return;

        retry.addEventListener('click', () => {
            retry.disabled = true;
            refreshBracketData().finally(() => {
                retry.disabled = false;
            });
        });
    }

    // Перерисовываем связи при любом изменении размеров контента/секций
    // (смена режима, появление скроллбаров, hide-rounds, данные и т.п.).
    function setupConnectionsResizeObserver() {
        if (typeof ResizeObserver === 'undefined') return;

        const content = document.getElementById('bracket-content');
        if (!content) return;

        let frame = null;
        const schedule = () => {
            if (frame !== null) return;
            frame = requestAnimationFrame(() => {
                frame = null;
                renderConnections();
            });
        };

        const observer = new ResizeObserver(schedule);
        observer.observe(content);

        ['winners-nodes', 'final-nodes', 'losers-nodes'].forEach(id => {
            const el = document.getElementById(id);
            if (el) observer.observe(el);
        });
    }

    async function refreshBracketData() {
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        const bracketId = pathParts[pathParts.length - 1];
        const theme = new URLSearchParams(window.location.search).get('theme') || '';

        if (!bracketId) {
            console.warn('[bracket] cannot refresh: bracketId not found in URL');
            return;
        }

        const url = `/widgets/bracket/${bracketId}/data?theme=${encodeURIComponent(theme)}`;

        try {
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) {
                let code = '';
                try {
                    const info = await res.json();
                    code = info && info.code ? info.code : '';
                } catch (e) {}

                if (code === 'external' || res.status === 503) {
                    showBracketError();
                }

                console.warn('[bracket] refresh failed:', res.status, code);
                return;
            }

            const data = await res.json();
            console.log('[bracket] new data received');

            hideBracketError();
            applyNewData(data);
        } catch (err) {
            console.warn('[bracket] refresh error:', err);
        }
    }

    function applyNewData(data) {
        if (!data) return;

        if (Array.isArray(data.sets)) {
            allSets.length = 0;
            allSets.push(...data.sets);
        }
        if (Array.isArray(data.connections)) {
            connections.length = 0;
            connections.push(...data.connections);
        }

        rebuildLayout();
    }

    // ============================================================
    // Flags
    // ============================================================

    function applyFlags(flags) {
        const root = document.documentElement;
        root.classList.toggle('transparent-bg', !!flags.transparent);
        root.classList.toggle('hide-rounds',    !!flags.hideRounds);

        applyBracketMode(flags.bracketMode || 'all');
        applyScale(flags.scale);

        if (flags.autoRefresh) {
            startAutoRefresh();
        } else {
            stopAutoRefresh();
        }

        console.log('[bracket] flags applied:', flags);
    }

    function applyBracketMode(mode) {
        const root = document.documentElement;
        root.classList.remove('bracket-mode-all', 'bracket-mode-winners', 'bracket-mode-losers');

        switch (mode) {
            case 'winners': root.classList.add('bracket-mode-winners'); break;
            case 'losers':  root.classList.add('bracket-mode-losers');  break;
            default:        root.classList.add('bracket-mode-all');     break;
        }
    }

    function applyFlagsAndRedraw(flags) {
        const prevMode = getBracketMode();

        applyFlags(flags);

        // Смена режима меняет расположение секций (например, losers
        // в режиме "losers" переносится наверх), поэтому нужна
        // полная пересборка разметки.
        if (prevMode !== getBracketMode()) {
            rebuildLayout();
            return;
        }

        layoutViewport();
        renderConnections();

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                renderConnections();
            });
        });
    }

    (function applyInitialFlags() {
        const params = new URLSearchParams(location.search);

        if (params.has('preview')) {
            document.documentElement.classList.add('preview-mode');
        }

        // Явные 0/1 в URL имеют приоритет; параметр без значения
        // по-прежнему считается включённым (обратная совместимость).
        const boolParam = (name) => {
            if (!params.has(name)) return false;
            const value = params.get(name);
            return value !== '0' && value !== 'false';
        };

        const bracketMode = params.get('bracketMode') || 'all';

        // URL — источник истины при инициализации. localStorage используется
        // только для старых ссылок, где флаги вообще не переданы.
        if (params.has('transparent') || params.has('hideRounds') ||
            params.has('bracketMode') || params.has('scale') ||
            params.has('autoRefresh')) {
            applyFlags({
                transparent: boolParam('transparent'),
                hideRounds:  boolParam('hideRounds'),
                bracketMode,
                scale:       params.get('scale') ? parseFloat(params.get('scale')) : 1.0,
                autoRefresh: boolParam('autoRefresh'),
            });
            return;
        }

        try {
            const stored = localStorage.getItem('bracket:flags');
            if (stored) {
                const flags = JSON.parse(stored);
                if (!flags.bracketMode) flags.bracketMode = 'all';
                applyFlags(flags);
            }
        } catch (e) {}
    })();

    try {
        const channel = new BroadcastChannel('bracket:flags');
        channel.onmessage = (event) => {
            if (!event.data || event.data.type !== 'bracket:flags-changed') return;
            console.log('[bracket] BroadcastChannel message:', event.data.flags);
            applyFlagsAndRedraw(event.data.flags);
        };
        console.log('[bracket] BroadcastChannel connected');
    } catch (e) {
        console.warn('[bracket] BroadcastChannel not available:', e);
    }

    window.addEventListener('storage', (event) => {
        if (event.key !== 'bracket:flags' || !event.newValue) return;
        try {
            const flags = JSON.parse(event.newValue);
            console.log('[bracket] storage event:', flags);
            applyFlagsAndRedraw(flags);
        } catch (e) {
            console.warn('[bracket] storage event parse error:', e);
        }
    });

    window.addEventListener('message', (event) => {
        if (!event.data || event.data.type !== 'bracket:flags-changed') return;
        console.log('[bracket] postMessage:', event.data.flags);
        applyFlagsAndRedraw(event.data.flags);
    });

    const BRACKET_FLAGS_URL = '/widgets/bracket/flags';
    let lastFlagsJson = null;

    async function fetchFlagsFromBackend() {
        try {
            const res = await fetch(BRACKET_FLAGS_URL, { cache: 'no-store' });
            if (!res.ok) return null;
            return await res.json();
        } catch (e) {
            return null;
        }
    }

    // Флаги из бэкенда считаются валидными только если они инициализированы.
    // Нулевые значения (bracketMode == "", scale == 0) означают, что
    // программа ещё не передала состояние — такие данные игнорируем,
    // чтобы не перетереть корректные флаги из URL/программы.
    function flagsAreUsable(flags) {
        if (!flags || typeof flags !== 'object') return false;

        if (flags.bracketMode !== 'all' &&
            flags.bracketMode !== 'winners' &&
            flags.bracketMode !== 'losers') {
            return false;
        }

        if (typeof flags.scale !== 'number' || !(flags.scale > 0)) {
            return false;
        }

        return true;
    }

    async function pollFlags() {
        const flags = await fetchFlagsFromBackend();
        if (!flags) return;

        if (!flagsAreUsable(flags)) {
            return;
        }

        const json = JSON.stringify(flags);
        if (json === lastFlagsJson) return;
        lastFlagsJson = json;

        console.log('[bracket] flags from backend:', flags);
        applyFlagsAndRedraw(flags);
    }

    pollFlags();
    setInterval(pollFlags, 1000);

    // ============================================================
    // Resize + start
    // ============================================================

    window.addEventListener('resize', () => {
        clearTimeout(window.resizeTimer);
        window.resizeTimer = setTimeout(() => {
            layoutViewport();
            renderConnections();
        }, 50);
    });

    window.addEventListener('load', () => {
        init();
        setupPlayerHighlight();
        bindZoomControls();
        setupDragPan();
        setupBracketError();
        setupPreviousBracketPlate();
        setupPlayerSearch();
        setupConnectionsResizeObserver();
        refreshBracketData();
    });
</script>

</body>
</html>
