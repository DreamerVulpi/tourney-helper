name: Tests

on:
  push:
    branches:
      - main
      - dev
  
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download dependecies
        run: go mod download
      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files are not formatted:"
            gofmt -l .
            exit 1
          fi 
      - name: Run go vet
        run: go vet ./...
      - name: Run Tests
        run: go test -race -cover -timeout 1m ./...