name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create Wails configuration
        shell: pwsh
        run: |
          @'
          {
            "$schema": "https://wails.io/schemas/config.v2.json",
            "name": "TourneyHelper",
            "outputfilename": "TourneyHelper.exe",
            "frontend:install": "npm install",
            "frontend:build": "npm run build",
            "frontend:dev:watcher": "npm run dev",
            "frontend:dev:serverUrl": "auto",
            "author": {
              "name": "DreamerVulpi",
              "email": "release@release.com"
            }
          }
          '@ | Set-Content -Path wails.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Build application
        run: >
          wails build --clean
          -ldflags "-X github.com/dreamervulpi/tourney-helper/internal/version.Current=${{ github.ref_name }}
          -X github.com/dreamervulpi/tourney-helper/internal/version.DebugMode=false"

      - name: Build updater
        run: go build -o build/bin/updater.exe ./cmd/update

      - name: Archive build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/bin/* `
            -DestinationPath TourneyHelper-${{ github.ref_name }}-Windows-x64.zip
            -Force `

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            TourneyHelper-${{ github.ref_name }}-Windows-x64.zip