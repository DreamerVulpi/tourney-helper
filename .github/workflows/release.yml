name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -cover -timeout 1m ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Build application
        run: >
          wails build --clean
          -ldflags "-X github.com/dreamervulpi/tourney-helper/internal/version.Current=${{ github.ref_name }}"

      - name: Build updater
        run: go build -o build/bin/updater.exe ./cmd/updater

      - name: Archive build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/bin/* `
            -DestinationPath TourneyHelper-${{ github.ref_name }}-Windows-x64.zip
            -Force `

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            TourneyHelper-${{ github.ref_name }}-Windows-x64.zip